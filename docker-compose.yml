services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: javiessefilme-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=production
      - GIN_MODE=release
      - DB_DRIVER=postgres
      - DB_SOURCE=postgres://javiessefilme:javiessefilme_password@postgres:5432/javiessefilme_db?sslmode=disable
      - SESSION_SECRET=javiessefilme_production_secret_key_32bytes_min
      - FRONTEND_URL=http://localhost:5173
      - TMDB_API_KEY=
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_data:/app/data

  postgres:
    image: postgres:16-alpine
    container_name: javiessefilme-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: javiessefilme
      POSTGRES_PASSWORD: javiessefilme_password
      POSTGRES_DB: javiessefilme_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U javiessefilme -d javiessefilme_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_data:
  postgres_data:
