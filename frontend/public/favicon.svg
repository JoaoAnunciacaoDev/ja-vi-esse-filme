<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradiente de fundo escuro estilo cinema -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Gradiente da Claquete / Rolo de Filme -->
    <linearGradient id="clapperGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="popcornGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Fundo Arredondado com borda moderna -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Claquete Cinematográfica Estilizada -->
  <g transform="translate(10, 12)">
    <!-- Corpo inferior da claquete -->
    <rect x="0" y="14" width="44" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    
    <!-- Tela central com símbolo de 'Play' brilhante em Rose -->
    <rect x="4" y="18" width="36" height="20" rx="4" fill="#090d16"/>
    <path d="M19 23.5L27 28L19 32.5V23.5Z" fill="url(#clapperGrad)"/>

    <!-- Braço superior da claquete (inclinado abrindo a cena) -->
    <g transform="rotate(-12 0 12)">
      <rect x="0" y="0" width="44" height="11" rx="3.5" fill="#0f172a" stroke="#e11d48" stroke-width="2"/>
      <!-- Listras da claquete -->
      <path d="M8 0L3 11M18 0L13 11M28 0L23 11M38 0L33 11" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Marca de Verificação / Estrela de 'Já Vi' -->
    <circle cx="38" cy="36" r="6" fill="#f43f5e"/>
    <path d="M35 36L37 38L41 34" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>